<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partes Diarios V7</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#eef3f8;
color:#1e293b;
}

.header{
background:#0088cc;
padding:10px;
text-align:center;
color:white;
-webkit-print-color-adjust: exact;
print-color-adjust: exact;
}

.header h1{
margin:0;
font-size:22px;
}

.container{
max-width:1200px;
margin:auto;
padding:14px;
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:14px;
box-shadow:0 4px 16px rgba(0,0,0,.08);
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.field{
display:flex;
flex-direction:column;
}

label{
font-size:13px;
font-weight:600;
margin-bottom:4px;
}

input,select{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #d0d7e2;
box-sizing:border-box;
}

.editor{
min-height:180px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:16px;
}

button{
background:#0088cc;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

button.secondary{
background:#64748b;
}

.hidden{
display:none;
}

.ql-editor{
min-height:140px;
font-size:14px;
overflow:visible!important;
}

#printArea{
background:white;
padding:10px;
}

@media(max-width:900px){
.grid{grid-template-columns:1fr 1fr;}
}

@media(max-width:600px){
.grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div id="printArea">

<div class="header">
<h1>PARTES DIARIOS</h1>
</div>

<div class="container">

<div class="card">

<div class="grid">

<div class="field">
<label>Tipo</label>
<select id="tipo" onchange="toggleProyecto()">
<option>Proyecto</option>
<option>GGRR</option>
</select>
</div>

<div class="field hidden" id="proyectoBox">
<label>Nº Proyecto</label>
<input id="numProyecto">
</div>

<div class="field">
<label>Responsable</label>
<input id="responsable">
</div>

<div class="field">
<label>Fecha</label>
<input id="fecha">
</div>

<div class="field">
<label>Turno</label>
<select id="turno">
<option>Mañana</option>
<option>Tarde</option>
<option>Noche</option>
<option>Sol</option>
<option>Luna</option>
</select>
</div>

<div class="field">
<label>Horas</label>
<input type="number" id="horas">
</div>

</div>

</div>

<div class="card">
<label>Trabajos realizados</label>
<div id="editor1" class="editor"></div>
</div>

<div class="card">
<label>Incidencias</label>
<div id="editor2" class="editor"></div>
</div>

<div class="card">
<label>Observaciones</label>
<div id="editor3" class="editor"></div>
</div>

</div>

</div>

<div class="container">

<div class="buttons">
<button onclick="guardarJSON()">Guardar JSON</button>
<button onclick="exportarPDF()">Exportar PDF</button>
<button onclick="exportarDOCX()">Exportar DOCX</button>
<button onclick="abrirOutlook()">Outlook</button>
<button class="secondary" onclick="limpiar()">Limpiar</button>
</div>

</div>

<script>

const q1 = new Quill('#editor1',{theme:'snow'});
const q2 = new Quill('#editor2',{theme:'snow'});
const q3 = new Quill('#editor3',{theme:'snow'});

fecha.value = new Date().toLocaleDateString('es-ES',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});

function toggleProyecto(){
if(tipo.value==='Proyecto'){
proyectoBox.classList.remove('hidden');
}else{
proyectoBox.classList.add('hidden');
}
}

toggleProyecto();

function datos(){
return{
tipo:tipo.value,
proyecto:numProyecto.value,
responsable:responsable.value,
fecha:fecha.value,
turno:turno.value,
horas:horas.value,
trabajos:q1.root.innerHTML,
incidencias:q2.root.innerHTML,
observaciones:q3.root.innerHTML
};
}

function nombreBase(){
const f = new Date().toISOString().split('T')[0];
return `Parte_${tipo.value}_${f}`;
}

function guardarJSON(){

const blob = new Blob(
[JSON.stringify(datos(),null,2)],
{type:'application/json'}
);

saveAs(blob, nombreBase()+'.json');

}

async function exportarPDF(){

document.querySelectorAll('.ql-editor').forEach(e=>{
e.style.height='auto';
e.style.overflow='visible';
});

const element = document.getElementById('printArea');

const opt = {
margin:0.5,
filename:nombreBase()+'.pdf',
image:{type:'jpeg',quality:1},
html2canvas:{scale:2,useCORS:true},
jsPDF:{unit:'in',format:'a4',orientation:'portrait'}
};

await html2pdf().set(opt).from(element).save();

}

async function exportarDOCX(){

const d = datos();

const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;

const doc = new Document({
sections:[{
properties:{},
children:[

new Paragraph({
text:'PARTES DIARIOS',
heading:HeadingLevel.TITLE
}),

new Paragraph({
children:[new TextRun({text:`Responsable: ${d.responsable}`,bold:true})]
}),

new Paragraph(`Fecha: ${d.fecha}`),
new Paragraph(`Tipo: ${d.tipo}`),
new Paragraph(`Proyecto: ${d.proyecto}`),
new Paragraph(`Turno: ${d.turno}`),
new Paragraph(`Horas: ${d.horas}`),

new Paragraph({
text:'Trabajos realizados',
heading:HeadingLevel.HEADING_1
}),

new Paragraph(q1.getText()),

new Paragraph({
text:'Incidencias',
heading:HeadingLevel.HEADING_1
}),

new Paragraph(q2.getText()),

new Paragraph({
text:'Observaciones',
heading:HeadingLevel.HEADING_1
}),

new Paragraph(q3.getText())

]
}]
});

const blob = await Packer.toBlob(doc);

saveAs(blob, nombreBase()+'.docx');

}

function abrirOutlook(){

const d = datos();

const asunto = `Parte Diario - ${d.tipo} - ${d.fecha}`;

const cuerpo = `
Responsable: ${d.responsable}

Proyecto: ${d.proyecto}

Turno: ${d.turno}

Horas: ${d.horas}

TRABAJOS:
${q1.getText()}

INCIDENCIAS:
${q2.getText()}

OBSERVACIONES:
${q3.getText()}
`;

window.location.href =
`mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

}

function limpiar(){

if(confirm('¿Eliminar todos los datos?')){

localStorage.clear();

location.reload();

}

}

window.onload = ()=>{

const saved =
JSON.parse(localStorage.getItem('parteDiarioV7'));

if(saved){

tipo.value=saved.tipo;
numProyecto.value=saved.proyecto;
responsable.value=saved.responsable;
fecha.value=saved.fecha;
turno.value=saved.turno;
horas.value=saved.horas;

q1.root.innerHTML=saved.trabajos;
q2.root.innerHTML=saved.incidencias;
q3.root.innerHTML=saved.observaciones;

toggleProyecto();

}

}

window.addEventListener('beforeunload',()=>{

localStorage.setItem(
'parteDiarioV7',
JSON.stringify(datos())
);

});

</script>

</body>
</html>
