<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partes Diarios V6</title>

<link rel="manifest" href="manifest.json">

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#eef3f8;
color:#1e293b;
}

.header{
background:#0088cc;
padding:8px;
text-align:center;
color:white;
}

.header h1{
margin:0;
font-size:22px;
}

.container{
max-width:1200px;
margin:auto;
padding:14px;
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:14px;
box-shadow:0 4px 16px rgba(0,0,0,0.08);
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.field{
display:flex;
flex-direction:column;
}

label{
font-size:13px;
font-weight:600;
margin-bottom:4px;
}

input,select,textarea{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #d0d7e2;
box-sizing:border-box;
font-size:14px;
}

textarea{
min-height:100px;
resize:vertical;
}

#editor{
height:260px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:16px;
}

button{
background:#0088cc;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

button.secondary{
background:#64748b;
}

button.success{
background:#16a34a;
}

.hidden{
display:none;
}

.footer{
text-align:center;
padding:14px;
font-size:12px;
color:#64748b;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr 1fr;
}
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="header">
<h1>PARTES DIARIOS</h1>
</div>

<div class="container">

<div class="card">

<div class="grid">

<div class="field">
<label>Tipo</label>
<select id="tipo" onchange="toggleProyecto()">
<option value="Proyecto">Proyecto</option>
<option value="GGRR">GGRR</option>
</select>
</div>

<div class="field hidden" id="proyectoBox">
<label>Nº Proyecto</label>
<input id="numProyecto">
</div>

<div class="field">
<label>Responsable</label>
<input id="responsable">
</div>

<div class="field">
<label>Fecha</label>
<input id="fecha">
</div>

<div class="field">
<label>Turno</label>
<select id="turno">
<option>Mañana</option>
<option>Tarde</option>
<option>Noche</option>
<option>Sol</option>
<option>Luna</option>
</select>
</div>

<div class="field">
<label>Horas</label>
<input type="number" id="horas">
</div>

</div>

</div>

<div class="card">

<label>Trabajos realizados</label>

<div id="toolbar">

<span class="ql-formats">
<select class="ql-size"></select>
</span>

<span class="ql-formats">
<button class="ql-bold"></button>
<button class="ql-italic"></button>
<button class="ql-underline"></button>
</span>

<span class="ql-formats">
<select class="ql-color"></select>
</span>

<span class="ql-formats">
<button class="ql-list" value="ordered"></button>
<button class="ql-list" value="bullet"></button>
</span>

<span class="ql-formats">
<button class="ql-align" value=""></button>
<button class="ql-align" value="center"></button>
<button class="ql-align" value="right"></button>
</span>

</div>

<div id="editor"></div>

<p style="font-size:12px;color:#64748b;margin-top:10px;">
Puedes usar símbolos y emojis desde el teclado Windows o iPad 😊 ⚠️ ✔ 🔧 📌
</p>

</div>

<div class="card">
<label>Incidencias</label>
<textarea id="incidencias"></textarea>
</div>

<div class="card">
<label>Observaciones</label>
<textarea id="observaciones"></textarea>
</div>

<div class="buttons">

<button onclick="guardar()">
Guardar
</button>

<button onclick="window.print()">
Exportar PDF
</button>

<button onclick="exportarDOCX()">
Exportar DOCX
</button>

<button class="success" onclick="abrirOutlook()">
Outlook
</button>

<button class="secondary" onclick="limpiar()">
Limpiar
</button>

</div>

</div>

<div class="footer">
Partes Diarios V6 · Compatible con Windows, Office, iPad y iPhone
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>

const quill = new Quill('#editor',{
theme:'snow',
modules:{toolbar:'#toolbar'}
});

const hoy = new Date();

fecha.value =
hoy.toLocaleDateString('es-ES',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});

function toggleProyecto(){

if(tipo.value==='Proyecto'){
proyectoBox.classList.remove('hidden');
}else{
proyectoBox.classList.add('hidden');
}

}

toggleProyecto();

function recoger(){

return {
tipo:tipo.value,
numProyecto:numProyecto.value,
responsable:responsable.value,
fecha:fecha.value,
turno:turno.value,
horas:horas.value,
trabajos:quill.root.innerHTML,
incidencias:incidencias.value,
observaciones:observaciones.value
};

}

function guardar(){

localStorage.setItem(
'parteDiarioV6',
JSON.stringify(recoger())
);

alert('Guardado correctamente');

}

function limpiar(){

if(confirm('¿Eliminar datos?')){
localStorage.clear();
location.reload();
}

}

function abrirOutlook(){

const d = recoger();

const asunto =
`Parte Diario - ${d.tipo} - ${d.fecha}`;

const cuerpo = `
Responsable: ${d.responsable}

Tipo: ${d.tipo}

Proyecto: ${d.numProyecto}

Turno: ${d.turno}

Horas: ${d.horas}

Trabajos:
${quill.getText()}

Incidencias:
${d.incidencias}

Observaciones:
${d.observaciones}
`;

window.location.href =
`mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

}

function exportarDOCX(){

const contenido = `
<html xmlns:o='urn:schemas-microsoft-com:office:office'
xmlns:w='urn:schemas-microsoft-com:office:word'
xmlns='http://www.w3.org/TR/REC-html40'>

<head>
<meta charset='utf-8'>

<style>

body{
font-family:Calibri;
margin:40px;
}

h1{
color:#0088cc;
border-bottom:2px solid #0088cc;
padding-bottom:10px;
}

h2{
color:#0088cc;
margin-top:30px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td{
border:1px solid #cccccc;
padding:10px;
}

.footer{
margin-top:40px;
font-size:11px;
color:#666666;
text-align:center;
}

</style>
</head>

<body>

<h1>PARTE DIARIO</h1>

<table>

<tr>
<td><b>Responsable</b></td>
<td>${responsable.value}</td>
</tr>

<tr>
<td><b>Fecha</b></td>
<td>${fecha.value}</td>
</tr>

<tr>
<td><b>Tipo</b></td>
<td>${tipo.value}</td>
</tr>

<tr>
<td><b>Proyecto</b></td>
<td>${numProyecto.value}</td>
</tr>

<tr>
<td><b>Turno</b></td>
<td>${turno.value}</td>
</tr>

<tr>
<td><b>Horas</b></td>
<td>${horas.value}</td>
</tr>

</table>

<h2>Trabajos realizados</h2>

${quill.root.innerHTML}

<h2>Incidencias</h2>

<p>${incidencias.value}</p>

<h2>Observaciones</h2>

<p>${observaciones.value}</p>

<div class='footer'>
Documento generado automáticamente · Partes Diarios V6
</div>

</body>
</html>
`;

const blob = new Blob(
['\ufeff', contenido],
{type:'application/vnd.ms-word'}
);

const url = URL.createObjectURL(blob);

const a = document.createElement('a');

a.href = url;
a.download = 'Parte_Diario.docx';

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

}

window.onload = ()=>{

const data =
JSON.parse(localStorage.getItem('parteDiarioV6'));

if(data){

tipo.value=data.tipo;
numProyecto.value=data.numProyecto;
responsable.value=data.responsable;
fecha.value=data.fecha;
turno.value=data.turno;
horas.value=data.horas;

quill.root.innerHTML=data.trabajos;

incidencias.value=data.incidencias;
observaciones.value=data.observaciones;

toggleProyecto();

}

}

if('serviceWorker' in navigator){
navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
