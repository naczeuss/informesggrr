<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTE DIARIO GGRR v13</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#eef3f8;margin:0;padding:10px}
.container{max-width:900px;margin:auto;background:#fff;padding:15px;border-radius:8px}
h1{text-align:center;background:#0088cc;color:#fff;padding:10px;border-radius:6px}
.field{display:flex;flex-direction:column;margin-bottom:8px}
label{font-weight:700;font-size:12px;margin-bottom:3px}
input,select,textarea{padding:7px;border:1px solid #ccc;border-radius:6px;font-size:13px}
textarea{min-height:80px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
button{background:#0088cc;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}
button.danger{background:#cc0000}
</style>
</head>
<body>
<div class="container">
<h1>PARTE DIARIO GGRR</h1>
<div class="field"><label>Responsable</label><input id="responsable"></div>
<div class="field"><label>Fecha</label><input id="fecha"></div>
<div class="field"><label>Turno</label><select id="turno"><option>Mañana</option><option>Tarde</option><option>Noche</option><option>Sol</option><option>Luna</option></select></div>
<div class="field"><label>Horas</label><input type="number" id="horas"></div>
<div class="field"><label>Trabajos realizados</label><textarea id="trabajos"></textarea></div>
<div class="field"><label>Incidencias</label><textarea id="incidencias"></textarea></div>
<div class="field"><label>Observaciones</label><textarea id="observaciones"></textarea></div>
<div class="buttons">
<button onclick="guardar()">Guardar</button>
<button onclick="nuevoParte()" class="danger">Nuevo parte</button>
<button onclick="window.print()">PDF</button>
</div>
</div>
<script>
const KEY='parte_ggrr_v13';
fecha.value=new Date().toLocaleDateString('es-ES');
function guardar(){
 const data={responsable:responsable.value,fecha:fecha.value,turno:turno.value,horas:horas.value,trabajos:trabajos.value,incidencias:incidencias.value,observaciones:observaciones.value};
 localStorage.setItem(KEY,JSON.stringify(data));
 alert('Parte guardado');
}
function nuevoParte(){
 if(!confirm('¿Seguro que quieres iniciar un nuevo parte?'))return;
 localStorage.removeItem(KEY);
 document.querySelectorAll('input,textarea').forEach(e=>e.value='');
 fecha.value=new Date().toLocaleDateString('es-ES');
}
window.onload=()=>{
 const d=JSON.parse(localStorage.getItem(KEY));
 if(d){responsable.value=d.responsable;fecha.value=d.fecha;turno.value=d.turno;horas.value=d.horas;trabajos.value=d.trabajos;incidencias.value=d.incidencias;observaciones.value=d.observaciones}
}
</script>
</body>
</html>
