<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partes Diarios V8</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#eef3f8;
color:#1e293b;
}

.header{
background:#0088cc;
color:white;
text-align:center;
padding:10px;
}

.container{
max-width:1100px;
margin:auto;
padding:16px;
}

.card{
background:white;
border-radius:14px;
padding:16px;
margin-bottom:14px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
page-break-inside:avoid;
break-inside:avoid;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.field{
display:flex;
flex-direction:column;
}

label{
font-size:13px;
font-weight:600;
margin-bottom:4px;
}

input,select{
padding:10px;
border-radius:10px;
border:1px solid #d0d7e2;
font-size:14px;
}

.editor{
min-height:180px;
background:white;
}

.ql-editor{
min-height:140px;
overflow:visible!important;
font-size:14px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:18px;
}

button{
background:#0088cc;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

button.secondary{
background:#64748b;
}

.hidden{
display:none;
}

#a4{
width:210mm;
min-height:297mm;
background:white;
margin:auto;
box-sizing:border-box;
padding:10mm;
}

.print-header{
background:#0088cc;
color:white;
padding:8px;
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:16px;
-webkit-print-color-adjust:exact;
print-color-adjust:exact;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr 1fr;
}
#a4{
width:100%;
padding:10px;
}
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="header">
<h2>PARTES DIARIOS V8</h2>
</div>

<div class="container">

<div id="a4">

<div class="print-header">
PARTES DIARIOS
</div>

<div class="card">

<div class="grid">

<div class="field">
<label>Tipo</label>
<select id="tipo" onchange="toggleProyecto()">
<option>Proyecto</option>
<option>GGRR</option>
</select>
</div>

<div class="field hidden" id="proyectoBox">
<label>Nº Proyecto</label>
<input id="numProyecto">
</div>

<div class="field">
<label>Responsable</label>
<input id="responsable">
</div>

<div class="field">
<label>Fecha</label>
<input id="fecha">
</div>

<div class="field">
<label>Turno</label>
<select id="turno">
<option>Mañana</option>
<option>Tarde</option>
<option>Noche</option>
<option>Sol</option>
<option>Luna</option>
</select>
</div>

<div class="field">
<label>Horas</label>
<input type="number" id="horas">
</div>

</div>

</div>

<div class="card">
<label>Trabajos realizados</label>
<div id="editor1" class="editor"></div>
</div>

<div class="card">
<label>Incidencias</label>
<div id="editor2" class="editor"></div>
</div>

<div class="card">
<label>Observaciones</label>
<div id="editor3" class="editor"></div>
</div>

</div>

<div class="buttons">

<button onclick="guardarLocal()">
Guardar
</button>

<button onclick="guardarComo()">
Guardar en...
</button>

<button onclick="exportarPDF()">
Exportar PDF
</button>

<button onclick="abrirOutlook()">
Outlook
</button>

<button class="secondary" onclick="limpiar()">
Limpiar
</button>

</div>

</div>

<script>

const q1 = new Quill('#editor1',{theme:'snow'});
const q2 = new Quill('#editor2',{theme:'snow'});
const q3 = new Quill('#editor3',{theme:'snow'});

fecha.value = new Date().toLocaleDateString('es-ES',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});

function toggleProyecto(){

if(tipo.value==='Proyecto'){
proyectoBox.classList.remove('hidden');
}else{
proyectoBox.classList.add('hidden');
}

}

toggleProyecto();

function datos(){

return{
tipo:tipo.value,
proyecto:numProyecto.value,
responsable:responsable.value,
fecha:fecha.value,
turno:turno.value,
horas:horas.value,
trabajos:q1.root.innerHTML,
incidencias:q2.root.innerHTML,
observaciones:q3.root.innerHTML
};

}

function nombreArchivo(){

const f = new Date().toISOString().split('T')[0];

return `Parte_${tipo.value}_${f}`;

}

function guardarLocal(){

localStorage.setItem(
'parteDiarioV8',
JSON.stringify(datos())
);

alert('Guardado correctamente');

}

async function guardarComo(){

const contenido = JSON.stringify(datos(),null,2);

const blob = new Blob([contenido],{type:'application/json'});

if(window.showSaveFilePicker){

const handle = await window.showSaveFilePicker({
suggestedName:nombreArchivo()+'.json',
types:[{
description:'JSON',
accept:{'application/json':['.json']}
}]
});

const writable = await handle.createWritable();

await writable.write(blob);

await writable.close();

alert('Archivo guardado');

}else{

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = nombreArchivo()+'.json';

a.click();

}

}

async function exportarPDF(){

document.querySelectorAll('.ql-editor').forEach(e=>{

e.style.height='auto';
e.style.overflow='visible';

});

const element = document.getElementById('a4');

const options = {

margin:[5,5,5,5],

filename:nombreArchivo()+'.pdf',

image:{
type:'jpeg',
quality:1
},

html2canvas:{
scale:2,
useCORS:true,
scrollY:0
},

jsPDF:{
unit:'mm',
format:'a4',
orientation:'portrait'
},

pagebreak:{
mode:['avoid-all','css','legacy']
}

};

await html2pdf().set(options).from(element).save();

}

function abrirOutlook(){

const d = datos();

const asunto =
`Parte Diario - ${d.tipo} - ${d.fecha}`;

const cuerpo = `
Responsable: ${d.responsable}

Proyecto: ${d.proyecto}

Turno: ${d.turno}

Horas: ${d.horas}

(Adjuntar PDF generado)
`;

window.location.href =
`mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

}

function limpiar(){

if(confirm('¿Eliminar datos?')){

localStorage.clear();

location.reload();

}

}

window.onload = ()=>{

const saved =
JSON.parse(localStorage.getItem('parteDiarioV8'));

if(saved){

tipo.value=saved.tipo;
numProyecto.value=saved.proyecto;
responsable.value=saved.responsable;
fecha.value=saved.fecha;
turno.value=saved.turno;
horas.value=saved.horas;

q1.root.innerHTML=saved.trabajos;
q2.root.innerHTML=saved.incidencias;
q3.root.innerHTML=saved.observaciones;

toggleProyecto();

}

}

</script>

</body>
</html>
