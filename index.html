<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partes Diarios V8.1</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:#eef3f8}
.top{background:#0088cc;color:#fff;padding:12px;text-align:center;font-size:22px;font-weight:bold}
.wrap{max-width:1100px;margin:auto;padding:15px}
#a4{width:190mm;background:#fff;margin:auto;padding:10mm;box-sizing:border-box}
.card{border:1px solid #ccc;border-radius:10px;padding:12px;margin-bottom:12px;page-break-inside:avoid}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.field{display:flex;flex-direction:column}
label{font-size:12px;font-weight:700;margin-bottom:4px}
input,select{padding:8px;border:1px solid #ccc;border-radius:8px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{background:#0088cc;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.ql-editor{min-height:120px;overflow:visible!important}
.hidden{display:none}
.print-header{background:#0088cc;color:#fff;text-align:center;padding:8px;font-size:22px;font-weight:bold;margin-bottom:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}#a4{width:100%}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top">PARTES DIARIOS V8.1</div>

<div class="wrap">

<div id="a4">

<div class="print-header">PARTES DIARIOS</div>

<div class="card">

<div class="grid">

<div class="field">
<label>Tipo</label>
<select id="tipo" onchange="toggleProyecto()">
<option>Proyecto</option>
<option>GGRR</option>
</select>
</div>

<div class="field hidden" id="proyectoBox">
<label>Nº Proyecto</label>
<input id="numProyecto">
</div>

<div class="field">
<label>Responsable</label>
<input id="responsable">
</div>

<div class="field">
<label>Fecha</label>
<input id="fecha">
</div>

<div class="field">
<label>Turno</label>
<select id="turno">
<option>Mañana</option>
<option>Tarde</option>
<option>Noche</option>
<option>Sol</option>
<option>Luna</option>
</select>
</div>

<div class="field">
<label>Horas</label>
<input type="number" id="horas">
</div>

</div>

</div>

<div class="card">
<label>Trabajos realizados</label>
<div id="editor1"></div>
</div>

<div class="card">
<label>Incidencias</label>
<div id="editor2"></div>
</div>

<div class="card">
<label>Observaciones</label>
<div id="editor3"></div>
</div>

</div>

<div class="buttons">
<button onclick="guardar()">Guardar</button>
<button onclick="exportarPDF()">Guardar PDF</button>
<button onclick="guardarDOC()">Guardar DOC</button>
<button onclick="outlook()">Outlook</button>
</div>

</div>

<script>

const toolbar = [
['bold','italic','underline'],
[{color:[]}],
[{list:'ordered'},{list:'bullet'}]
];

const q1 = new Quill('#editor1',{theme:'snow',modules:{toolbar}});
const q2 = new Quill('#editor2',{theme:'snow',modules:{toolbar}});
const q3 = new Quill('#editor3',{theme:'snow',modules:{toolbar}});

fecha.value = new Date().toLocaleDateString('es-ES',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});

function toggleProyecto(){
if(tipo.value==='Proyecto'){
proyectoBox.classList.remove('hidden');
}else{
proyectoBox.classList.add('hidden');
}
}

toggleProyecto();

function guardar(){

const datos = {
tipo:tipo.value,
proyecto:numProyecto.value,
responsable:responsable.value,
fecha:fecha.value,
turno:turno.value,
horas:horas.value,
trabajos:q1.root.innerHTML,
incidencias:q2.root.innerHTML,
observaciones:q3.root.innerHTML
};

localStorage.setItem('partesv81',JSON.stringify(datos));

alert('Guardado correctamente');

}

window.onload = ()=>{

const d = JSON.parse(localStorage.getItem('partesv81'));

if(d){

tipo.value=d.tipo;
numProyecto.value=d.proyecto;
responsable.value=d.responsable;
fecha.value=d.fecha;
turno.value=d.turno;
horas.value=d.horas;

q1.root.innerHTML=d.trabajos;
q2.root.innerHTML=d.incidencias;
q3.root.innerHTML=d.observaciones;

toggleProyecto();

}

};

async function exportarPDF(){

document.querySelectorAll('.ql-editor').forEach(e=>{
e.style.height='auto';
});

const element = document.getElementById('a4');

await html2pdf().set({
margin:[5,5,5,5],
filename:'Parte_Diario.pdf',
html2canvas:{scale:2},
jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
pagebreak:{mode:['avoid-all','css']}
}).from(element).save();

}

function guardarDOC(){

const contenido = `
PARTE DIARIO

Responsable: ${responsable.value}

Fecha: ${fecha.value}

Trabajos:
${q1.getText()}

Incidencias:
${q2.getText()}

Observaciones:
${q3.getText()}
`;

const blob = new Blob([contenido],{type:'application/msword'});

const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'Parte_Diario.doc';
a.click();

}

function outlook(){

const body = `
Responsable: ${responsable.value}

Fecha: ${fecha.value}

Trabajos:
${q1.getText()}

Incidencias:
${q2.getText()}

Observaciones:
${q3.getText()}
`;

window.location.href =
`mailto:?subject=Parte Diario&body=${encodeURIComponent(body)}`;

}

</script>

</body>
</html>
