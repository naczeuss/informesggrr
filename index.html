<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partes Diarios V10 Compact</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#eef3f8;
font-size:13px;
}

.top{
background:#0088cc;
color:white;
padding:6px;
text-align:center;
font-size:18px;
font-weight:700;
}

.wrap{
max-width:1000px;
margin:auto;
padding:8px;
}

#a4{
width:182mm;
background:white;
margin:auto;
padding:5mm;
box-sizing:border-box;
}

.card{
border:1px solid #d8d8d8;
border-radius:6px;
padding:6px;
margin-bottom:6px;
page-break-inside:avoid;
}

.grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:6px;
}

.field{
display:flex;
flex-direction:column;
}

label{
font-size:11px;
font-weight:700;
margin-bottom:2px;
color:#444;
}

input,select{
padding:5px;
border:1px solid #cfcfcf;
border-radius:5px;
font-size:12px;
}

.section-title{
font-size:12px;
font-weight:700;
margin-bottom:4px;
color:#0088cc;
}

.ql-toolbar{
padding:2px !important;
}

.ql-toolbar button{
width:22px !important;
height:22px !important;
}

.ql-editor{
min-height:70px;
font-size:12px;
padding:6px !important;
overflow:visible !important;
line-height:1.25;
}

.buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

button{
background:#0088cc;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
font-size:12px;
font-weight:700;
cursor:pointer;
}

.hidden{
display:none;
}

.print-header{
background:#0088cc;
color:white;
padding:5px;
text-align:center;
font-size:18px;
font-weight:700;
margin-bottom:6px;
-webkit-print-color-adjust:exact;
print-color-adjust:exact;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr 1fr;
}
#a4{
width:100%;
}
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="top">
PARTES DIARIOS V10 COMPACT
</div>

<div class="wrap">

<div id="a4">

<div class="print-header">
PARTE DIARIO
</div>

<div class="card">

<div class="grid">

<div class="field">
<label>Tipo</label>
<select id="tipo" onchange="toggleProyecto()">
<option>Proyecto</option>
<option>GGRR</option>
</select>
</div>

<div class="field hidden" id="proyectoBox">
<label>Proyecto</label>
<input id="numProyecto">
</div>

<div class="field">
<label>Responsable</label>
<input id="responsable">
</div>

<div class="field">
<label>Fecha</label>
<input id="fecha">
</div>

<div class="field">
<label>Turno</label>
<select id="turno">
<option>Mañana</option>
<option>Tarde</option>
<option>Noche</option>
<option>Sol</option>
<option>Luna</option>
</select>
</div>

<div class="field">
<label>Horas</label>
<input type="number" id="horas">
</div>

</div>

</div>

<div class="card">
<div class="section-title">Trabajos realizados</div>
<div id="editor1"></div>
</div>

<div class="card">
<div class="section-title">Incidencias</div>
<div id="editor2"></div>
</div>

<div class="card">
<div class="section-title">Observaciones</div>
<div id="editor3"></div>
</div>

</div>

<div class="buttons">
<button onclick="guardar()">Guardar</button>
<button onclick="exportarPDF()">PDF</button>
<button onclick="guardarDOC()">DOC</button>
<button onclick="outlook()">Outlook</button>
</div>

</div>

<script>

const toolbar = [
['bold','italic'],
[{color:[]}],
[{list:'bullet'}]
];

const q1 = new Quill('#editor1',{
theme:'snow',
modules:{toolbar}
});

const q2 = new Quill('#editor2',{
theme:'snow',
modules:{toolbar}
});

const q3 = new Quill('#editor3',{
theme:'snow',
modules:{toolbar}
});

fecha.value = new Date().toLocaleDateString('es-ES',{
day:'2-digit',
month:'2-digit',
year:'numeric'
});

function toggleProyecto(){

if(tipo.value==='Proyecto'){
proyectoBox.classList.remove('hidden');
}else{
proyectoBox.classList.add('hidden');
}

}

toggleProyecto();

function nombreArchivo(){

const f = new Date().toISOString().split('T')[0];

return `Parte_${tipo.value}_${f}`;

}

function guardar(){

const datos = {
tipo:tipo.value,
proyecto:numProyecto.value,
responsable:responsable.value,
fecha:fecha.value,
turno:turno.value,
horas:horas.value,
trabajos:q1.root.innerHTML,
incidencias:q2.root.innerHTML,
observaciones:q3.root.innerHTML
};

localStorage.setItem('partesv10',JSON.stringify(datos));

alert('Guardado');

}

window.onload = ()=>{

const d = JSON.parse(localStorage.getItem('partesv10'));

if(d){

tipo.value=d.tipo;
numProyecto.value=d.proyecto;
responsable.value=d.responsable;
fecha.value=d.fecha;
turno.value=d.turno;
horas.value=d.horas;

q1.root.innerHTML=d.trabajos;
q2.root.innerHTML=d.incidencias;
q3.root.innerHTML=d.observaciones;

toggleProyecto();

}

};

async function exportarPDF(){

document.querySelectorAll('.ql-editor').forEach(e=>{
e.style.height='auto';
});

await html2pdf().set({

margin:[1,1,1,1],

filename:nombreArchivo()+'.pdf',

image:{
type:'jpeg',
quality:1
},

html2canvas:{
scale:2,
scrollY:0
},

jsPDF:{
unit:'mm',
format:'a4',
orientation:'portrait'
}

}).from(document.getElementById('a4')).save();

}

function guardarDOC(){

const contenido = `
PARTE DIARIO

Responsable: ${responsable.value}
Fecha: ${fecha.value}

TRABAJOS
${q1.getText()}

INCIDENCIAS
${q2.getText()}

OBSERVACIONES
${q3.getText()}
`;

const blob = new Blob([contenido],{type:'application/msword'});

const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = nombreArchivo()+'.doc';
a.click();

}

function outlook(){

const body = `
Responsable: ${responsable.value}

TRABAJOS:
${q1.getText()}

INCIDENCIAS:
${q2.getText()}

OBSERVACIONES:
${q3.getText()}
`;

window.location.href =
`mailto:?subject=${encodeURIComponent(nombreArchivo())}&body=${encodeURIComponent(body)}`;

}

</script>

</body>
</html>
