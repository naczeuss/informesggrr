
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>v11</title>
<style>
body{font-family:Arial;background:#eef3f8}
.box{width:185mm;margin:auto;background:white;padding:10px}
.header{background:#0088cc;color:white;padding:8px;text-align:center;border-radius:6px}
.grid{
display:grid;
grid-template-columns:0.8fr 4fr 0.7fr 1fr 55px;
gap:8px;
margin-top:10px
}
input,select{padding:6px;width:100%;box-sizing:border-box}
#horas{width:55px}
</style>
</head>
<body>
<div class="box">
<div class="header">PARTE DIARIO GGRR</div>
<div class="grid">
<div><label>Tipo</label><select><option>GGRR</option></select></div>
<div><label>Responsable</label><input placeholder="Nombre y dos apellidos"></div>
<div><label>Fecha</label><input value="13/05/26"></div>
<div><label>Turno</label><select><option>Mañana</option></select></div>
<div><label>Horas</label><input id="horas"></div>
</div>
</div>
</body>
</html>
