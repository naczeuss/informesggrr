<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parte Diario V10d</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#eef3f8;
font-size:13px;
}

.wrap{
max-width:1000px;
margin:auto;
padding:8px;
}

#a4{
width:182mm;
background:white;
margin:auto;
padding:5mm;
box-sizing:border-box;
}

.card{
border:1px solid #d8d8d8;
border-radius:6px;
padding:6px;
margin-bottom:6px;
page-break-inside:avoid;
}

.grid{
display:grid;
grid-template-columns:0.9fr 0.9fr 3fr 0.6fr 1fr 60px;
gap:6px;
align-items:end;
}

.field{
display:flex;
flex-direction:column;
}

label{
font-size:11px;
font-weight:700;
margin-bottom:2px;
color:#444;
}

input,select{
padding:5px;
border:1px solid #cfcfcf;
border-radius:5px;
font-size:12px;
box-sizing:border-box;
width:100%;
}

#horas{
width:60px;
}

.section-title{
font-size:12px;
font-weight:700;
margin-bottom:4px;
color:#0088cc;
}

.ql-toolbar{
padding:2px !important;
}

.ql-toolbar button{
width:22px !important;
height:22px !important;
}

.ql-editor{
min-height:70px;
font-size:12px;
padding:6px !important;
overflow:visible !important;
line-height:1.25;
}

.buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

button{
background:#0088cc;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
font-size:12px;
font-weight:700;
cursor:pointer;
}

.hidden{
display:none;
}

.print-header{
background:#0088cc;
color:white;
padding:5px;
text-align:center;
font-size:18px;
font-weight:700;
margin-bottom:6px;
-webkit-print-color-adjust:exact;
print-color-adjust:exact;
border-radius:6px;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr 1fr;
}
#a4{
width:100%;
}
#horas{
width:100%;
}
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="wrap">

<div id="a4">

<div class="print-header" id="tituloParte">
PARTE DIARIO GGRR
</div>

<div class="card">

<div class="grid">

<div class="field">
<label>Tipo</label>
<select id="tipo" onchange="actualizarTitulo();toggleProyecto()">
<option>GGRR</option>
<option>Proyecto</option>
</select>
</div>

<div class="field hidden" id="proyectoBox">
<label>Proyecto</label>
<input id="numProyecto">
</div>

<div class="field">
<label>Responsable</label>
<input id="responsable">
</div>

<div class="field">
<label>Fecha</label>
<input id="fecha">
</div>

<div class="field">
<label>Turno</label>
<select id="turno">
<option>Mañana</option>
<option>Tarde</option>
<option>Noche</option>
<option>Sol</option>
<option>Luna</option>
</select>
</div>

<div class="field">
<label>Horas</label>
<input type="number" id="horas">
</div>

</div>

</div>

<div class="card">
<div class="section-title">Trabajos realizados</div>
<div id="editor1"></div>
</div>

<div class="card">
<div class="section-title">Incidencias</div>
<div id="editor2"></div>
</div>

<div class="card">
<div class="section-title">Observaciones</div>
<div id="editor3"></div>
</div>

</div>

</body>
</html>
